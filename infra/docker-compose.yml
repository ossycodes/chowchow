name: chowdeck

services:
  mysql:
    image: mysql:8.0
    container_name: chowdeck-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      # Per-service databases are created by infra/mysql/init/01-databases.sql
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: chowdeck-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka-compatible broker (single binary, light on a laptop)
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: chowdeck-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"   # kafka (host)
      - "9644:9644"   # admin api
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: chowdeck-redpanda-console
    restart: unless-stopped
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"   # Kafka dashboard → http://localhost:8080

  # MySQL web dashboard (browse tables/data in the browser).
  adminer:
    image: adminer:4.8.1
    container_name: chowdeck-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      ADMINER_DEFAULT_SERVER: mysql   # pre-fills the "Server" field on the login page
      ADMINER_DESIGN: dracula
    ports:
      - "8081:8080"   # MySQL dashboard → http://localhost:8081

  redis-insight:
    image: redis/redisinsight:latest
    container_name: chowdeck-redis-insight
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8082:5540"   # Redis dashboard → http://localhost:8082
    volumes:
      - redisinsight-data:/data

volumes:
  redisinsight-data:
  mysql-data:
  redis-data:
  redpanda-data:
